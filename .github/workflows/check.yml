name: Check
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check Settings, appearance and offline privacy notice
        run: npm run smoke:settings
      - name: Check responsive layouts and review dialogs
        run: npm run smoke:layout
      - name: Check Workspace recovery and News reading
        run: |
          npm run smoke:recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run smoke:news
      - name: Check assistant latency paths, local memory and verified compound results
        run: npm run smoke:assistant
      - name: Check conversational routine creation, review and cancellation
        run: npm run smoke:routines
      - name: Check local audio setup controls
        run: npm run smoke:audio-setup
      - name: Check personal backups and Notes history
        run: npm run smoke:backups
      - name: Check native update handoff, completion and recovery
        run: npm run smoke:installer

      - name: Check native tray alpha on light and dark backgrounds
        run: powershell -NoProfile -File scripts/verify-tray-native.ps1
      - name: Check hidden rendering and timer deadlines
        run: npm run smoke:resources

      - name: Check work tools, review gates and local file recovery
        run: npm run smoke:workbench
