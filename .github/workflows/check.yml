name: Check
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check native update handoff, completion and recovery
        run: npm run smoke:installer

      - name: Check native tray alpha on light and dark backgrounds
        run: powershell -NoProfile -File scripts/verify-tray-native.ps1
      - name: Check hidden rendering and timer deadlines
        run: npm run smoke:resources

      - name: Check work tools, review gates and local file recovery
        run: npm run smoke:workbench
