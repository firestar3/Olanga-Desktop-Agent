<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Olanga Side Light</title>
  <link rel="stylesheet" href="status-indicator.css" />
  <script src="status-indicator.js" defer></script>
</head>
<body data-state="off">
  <section id="quickMenu" role="dialog" aria-labelledby="menuTitle" aria-describedby="menuHint" hidden>
    <header class="menu-heading">
      <h1 id="menuTitle">Olanga</h1><p id="statusText" role="status">Ready</p>
    </header>
    <div id="quickActions" class="quick-actions" aria-label="Your five shortcuts"></div>
    <div class="utility-actions">
      <button id="hideLight" type="button">Hide Side Light for 5 seconds</button>
      <button id="hideLightHour" type="button">Hide Side Light for 1 hour</button>
      <button id="openApp" type="button">Open Olanga App</button>
    </div>
    <p id="menuHint" class="menu-hint">Edit shortcuts in Settings <span>Esc</span></p>
  </section>
  <button id="light" type="button" aria-label="Open Olanga shortcuts" aria-haspopup="dialog" aria-controls="quickMenu" aria-expanded="false" hidden>
    <span class="light-surface" aria-hidden="true"></span>
  </button>
</body>
</html>
